<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Univers de Mouatez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .card { perspective: 1000px; }
        .card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
        .card.flipped .card-inner { transform: rotateY(180deg); }
        .card-back { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-blue-50 text-gray-800 min-h-screen font-sans">

    <header class="bg-blue-600 text-white p-6 shadow-lg text-center">
        <h1 class="text-4xl font-extrabold tracking-tight">L'Univers de Mouatez</h1>
        <p class="mt-2 text-blue-100">Prêt pour l'aventure, petit génie ?</p>
    </header>

    <main class="container mx-auto p-4 md:p-8">
        <!-- Dashboard Buttons -->
        <div class="flex justify-center gap-4 mb-8">
            <button onclick="showSection('memory')" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-3 px-6 rounded-full shadow-md transition">Jeu de Mémoire</button>
            <button onclick="showSection('quiz')" class="bg-green-400 hover:bg-green-500 text-green-900 font-bold py-3 px-6 rounded-full shadow-md transition">Le Quiz des Génies</button>
        </div>

        <section id="memory-section" class="game-section hidden">
            <h2 class="text-2xl font-bold mb-4 text-center">Jeu de Mémoire</h2>
            <div id="memory-grid" class="grid grid-cols-4 gap-4 max-w-lg mx-auto"></div>
        </section>

        <section id="quiz-section" class="game-section hidden">
            <div id="quiz-container" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-xl">
                <div id="question-box">
                    <h2 class="text-xl font-bold mb-4" id="question-text">Question ici</h2>
                    <div id="options-grid" class="grid grid-cols-1 gap-3"></div>
                </div>
            </div>
        </section>

        <!-- Home placeholder -->
        <div id="home-section" class="text-center mt-20">
            <h2 class="text-3xl font-bold text-blue-800">Bienvenue, Mouatez !</h2>
            <p class="mt-4 text-gray-600">Choisis un jeu ci-dessus pour commencer à t'amuser.</p>
        </div>
    </main>

    <script>
        // --- Navigation ---
        function showSection(id) {
            document.querySelectorAll('.game-section').forEach(s => s.classList.add('hidden'));
            document.getElementById('home-section').classList.add('hidden');
            document.getElementById(id + '-section').classList.remove('hidden');
        }

        // --- Memory Game Logic ---
        const emojis = ['🚀', '🌟', '🧩', '🎨', '🚀', '🌟', '🧩', '🎨'];
        let shuffled = emojis.sort(() => Math.random() - 0.5);
        const grid = document.getElementById('memory-grid');
        
        function initMemory() {
            grid.innerHTML = '';
            shuffled.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card w-full h-24 cursor-pointer';
                card.innerHTML = `
                    <div class="card-inner w-full h-full relative">
                        <div class="card-front absolute w-full h-full bg-blue-500 rounded-xl flex items-center justify-center text-white text-2xl font-bold">?</div>
                        <div class="card-back absolute w-full h-full bg-white rounded-xl flex items-center justify-center text-4xl shadow-md border-2 border-blue-200">${emoji}</div>
                    </div>
                `;
                card.onclick = () => card.classList.toggle('flipped');
                grid.appendChild(card);
            });
        }
        initMemory();

        // --- Quiz Logic ---
        const questions = [
            { q: "Combien font 2 + 2 ?", a: ["4", "3", "5"], correct: "4" },
            { q: "Quelle est la couleur du ciel ?", a: ["Vert", "Bleu", "Rouge"], correct: "Bleu" }
        ];
        
        function loadQuiz() {
            const q = questions[0];
            document.getElementById('question-text').innerText = q.q;
            const container = document.getElementById('options-grid');
            container.innerHTML = '';
            q.a.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "p-3 bg-blue-100 rounded-lg hover:bg-blue-200 font-semibold";
                btn.innerText = opt;
                btn.onclick = () => alert(opt === q.correct ? "Bravo Mouatez ! ✨" : "Réessaie encore ! 💡");
                container.appendChild(btn);
            });
        }
        loadQuiz();
    </script>
</body>
</html>
